# Jekyll-GitBook тема для документации Grand Regions
# Документация: https://github.com/sighingnow/jekyll-gitbook

title: Grand Regions
longtitle: Grand Regions — публичная вики
description: Политическая онлайн-стратегия в Telegram Mini App. Гайды, механики, справочник.
author: Grand Regions Team

url: https://wiki.grand-regions.com
baseurl: ""

# Запинено на конкретный SHA — правило .claude/rules/sync-workflows.md.
remote_theme: sighingnow/jekyll-gitbook@a7d876936fe650c46eaf9eca92dc7afe0f1e1f17

# Markdown render engine.
markdown: kramdown
kramdown:
  auto_ids: true
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  toc_levels: 1..6
  syntax_highlighter: rouge

syntax_highlighter_style: colorful

# Контент TOC (правый sidebar по странице).
toc:
  enabled: true
  h_min: 2
  h_max: 3

# Ширина основной колонки.
page_width: 920px

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-readme-index

# Конвертация [text](file.md) → /file/ URL для коллекций тоже.
relative_links:
  enabled: true
  collections: true

# README.md в корне docs/ становится index сайта.
readme_index:
  enabled: true
  remove_originals: false
  with_frontmatter: true

# Коллекции = группы страниц в левом sidebar (по ordered_collections).
collections:
  player-guide:
    output: true
    sort_by: order
    permalink: /:collection/:path/
  game-mechanics:
    output: true
    sort_by: order
    permalink: /:collection/:path/
  reference:
    output: true
    sort_by: order
    permalink: /:collection/:path/

ordered_collections:
  - player-guide
  - game-mechanics
  - reference

# Внешние ссылки в шапке.
aux_links:
  GitHub:
    - https://github.com/aolychkin/grand-regions-wiki

# Permalinks для постов (не используется, но Jekyll требует).
permalink: /:categories/:title/

exclude:
  - "*.draft.md"
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
